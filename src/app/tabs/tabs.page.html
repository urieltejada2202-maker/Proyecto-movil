<ion-tabs>
  <ion-tab-bar slot="bottom" style="--background: #F4F4F4; border-top: 3px solid #1a1a1a; box-shadow: 0px -4px 0px rgba(0,0,0,0.1);">
    
    <ion-tab-button tab="home">
      <ion-icon name="home-outline" style="color: #1a1a1a;"></ion-icon>
      <ion-label style="font-weight: 800; color: #1a1a1a;">Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tablero">
      <ion-icon name="albums-outline" style="color: #1a1a1a;"></ion-icon>
      <ion-label style="font-weight: 800; color: #1a1a1a;">Tablero</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tareas">
      <ion-icon name="checkbox-outline" style="color: #1a1a1a;"></ion-icon>
      <ion-label style="font-weight: 800; color: #1a1a1a;">Tareas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="mapa">
      <ion-icon name="map-outline" style="color: #1a1a1a;"></ion-icon>
      <ion-label style="font-weight: 800; color: #1a1a1a;">Mapa</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="noticias">
      <ion-icon name="newspaper-outline" style="color: #1a1a1a;"></ion-icon>
      <ion-label style="font-weight: 800; color: #1a1a1a;">Noticias</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
