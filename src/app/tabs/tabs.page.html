<ion-tabs (ionTabsDidChange)="tabCambiada($event)">
  <ion-tab-bar slot="bottom" style="--background: #F4F4F4; border-top: 3px solid #1a1a1a; box-shadow: 0px -4px 0px rgba(0,0,0,0.1);">
    <ion-tab-button tab="home">
      <ion-icon [name]="tabSeleccionado === 'home' ? 'home' : 'home-outline'" 
                [style.color]="tabSeleccionado === 'home' ? '#3880ff' : '#1a1a1a'">
      </ion-icon>
      <ion-label [style.color]="tabSeleccionado === 'home' ? '#3880ff' : '#1a1a1a'" style="font-weight: 800;">
        Inicio
      </ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tablero">
      <ion-icon [name]="tabSeleccionado === 'tablero' ? 'albums' : 'albums-outline'" 
                [style.color]="tabSeleccionado === 'tablero' ? '#3880ff' : '#1a1a1a'">
      </ion-icon>
      <ion-label [style.color]="tabSeleccionado === 'tablero' ? '#3880ff' : '#1a1a1a'" style="font-weight: 800;">
        Tablero
      </ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tareas">
      <ion-icon [name]="tabSeleccionado === 'tareas' ? 'checkbox' : 'checkbox-outline'" 
                [style.color]="tabSeleccionado === 'tareas' ? '#3880ff' : '#1a1a1a'">
      </ion-icon>
      <ion-label [style.color]="tabSeleccionado === 'tareas' ? '#3880ff' : '#1a1a1a'" style="font-weight: 800;">
        Tareas
      </ion-label>
    </ion-tab-button>

    <ion-tab-button tab="mapa">
      <ion-icon [name]="tabSeleccionado === 'mapa' ? 'map' : 'map-outline'" 
                [style.color]="tabSeleccionado === 'mapa' ? '#3880ff' : '#1a1a1a'">
      </ion-icon>
      <ion-label [style.color]="tabSeleccionado === 'mapa' ? '#3880ff' : '#1a1a1a'" style="font-weight: 800;">
        Mapa
      </ion-label>
    </ion-tab-button>

    <ion-tab-button tab="noticias">
      <ion-icon [name]="tabSeleccionado === 'noticias' ? 'newspaper' : 'newspaper-outline'" 
                [style.color]="tabSeleccionado === 'noticias' ? '#3880ff' : '#1a1a1a'">
      </ion-icon>
      <ion-label [style.color]="tabSeleccionado === 'noticias' ? '#3880ff' : '#1a1a1a'" style="font-weight: 800;">
        Noticias
      </ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
