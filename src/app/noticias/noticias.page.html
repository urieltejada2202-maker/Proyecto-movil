<ion-content style="--background: #F4F4F4;">
  <div style="padding: 20px; padding-top: 40px;">
    
    <div style="display: flex; align-items: center; margin-bottom: 20px;">
      <h1 style="font-size: 26px; font-weight: 900; color: black; margin: 0; text-transform: uppercase;">Tech News 📰</h1>
    </div>

    <div *ngIf="cargando" style="text-align: center; margin-top: 60px;">
      <ion-spinner name="crescent" style="color: black; width: 40px; height: 40px;"></ion-spinner>
      <p style="font-weight: 800; color: black; margin-top: 15px;">Cargando artículos...</p>
    </div>

    <div *ngIf="!cargando">
      <div *ngFor="let noticia of noticias" style="background: white; border: 3px solid black; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 4px 4px 0px black;">
        
        <div style="width: 100%; height: 150px; border: 2px solid black; border-radius: 8px; margin-bottom: 12px; overflow: hidden; background: #eee;">
          <img [src]="noticia.urlToImage" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        
        <div style="font-size: 16px; font-weight: 900; color: black; margin-bottom: 8px; line-height: 1.2;">
          {{ noticia.title }}
        </div>
        
        <div style="font-size: 12px; font-weight: bold; color: #666; margin-bottom: 12px;">
          Fuente: {{ noticia.source?.name }}
        </div>
        
        <a [href]="noticia.url" target="_blank" style="display: block; text-decoration: none;">
          <div style="background: #bde0fe; border: 2px solid black; padding: 10px; border-radius: 8px; text-align: center; font-weight: 800; color: black; box-shadow: 2px 2px 0px black; cursor: pointer;">
            Leer más
          </div>
        </a>
      </div>
    </div>

  </div>
</ion-content>
