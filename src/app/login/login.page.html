<ion-content class="custom-bg">
  <div class="login-container">
    
    <div class="header-section">
      <ion-icon name="cube" class="main-icon" color="primary"></ion-icon>
      <h1 class="app-title">ProjectWizard</h1>
      <p class="app-subtitle">Gestión de Equipos de Desarrollo</p>
    </div>

    <ion-card class="login-card">
      <ion-card-content>
        <ion-list lines="none">
          
          <ion-item class="input-item">
            <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
            <ion-input 
              label="Usuario" 
              labelPlacement="floating" 
              [(ngModel)]="username" 
              type="text" 
              placeholder="Ej: Pedro">
            </ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
            <ion-input 
              label="Contraseña" 
              labelPlacement="floating" 
              [(ngModel)]="password" 
              type="password" 
              placeholder="Tu contraseña">
            </ion-input>
          </ion-item>

        </ion-list>

        <ion-button expand="block" shape="round" class="login-button" (click)="ingresar()">
          <ion-icon name="log-in-outline" slot="start"></ion-icon>
          Iniciar Sesión
        </ion-button>
      </ion-card-content>
    </ion-card>

  </div>

  <ion-toast 
    [isOpen]="mostrarError" 
    message="Usuario o contraseña incorrectos" 
    duration="2000" 
    (didDismiss)="mostrarError = false" 
    color="danger"
    icon="alert-circle-outline">
  </ion-toast>
</ion-content>
